<!doctype html>
<html>
  <head>
    <title>My Web</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="crud">
      <div id="head">
        <h1>crud</h1>
        <h3>create read update delete</h3>
      </div>
      <div id="inputs">
        <input type="text" id="title" placeholder="title" />
        <div id="prices">
          <input
            type="number"
            onkeyup="getTotal()"
            id="price"
            placeholder="price"
          />
          <input
            type="number"
            onkeyup="getTotal()"
            id="taxes"
            placeholder="taxes"
          />
          <input
            type="number"
            onkeyup="getTotal()"
            id="ads"
            placeholder="ads"
          />
          <input
            type="number"
            onkeyup="getTotal()"
            id="discount"
            placeholder="discount"
          />
          <p id="total">0</p>
        </div>
        <input type="number" id="count" placeholder="count" />
        <input type="text" id="category" placeholder="category" />
        <button id="create">create</button>
      </div>
      <div id="outputs">
        <input type="text" id="search" placeholder="search" />
        <div id="searchBtns">
          <button id="titleSearch" onclick="searchMood(this.id)">
            search by title
          </button>
          <button id="categorySearch" onclick="searchMood(this.id)">
            search by category
          </button>
        </div>
        <div id="deleteAll"></div>
        <div id="tablediv">
          <table>
            <thead>
              <tr>
                <th>id</th>
                <th>title</th>
                <th>price</th>
                <th>taxes</th>
                <th>ads</th>
                <th>discount</th>
                <th>total</th>
                <th>category</th>
                <th>update</th>
                <th>delete</th>
              </tr>
            </thead>
            <tbody id="Tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
